services:
  caddy:
    image: caddy:2.10-alpine
    ports:
      - "127.0.0.1:${PORT:-8080}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      armadietto: { condition: service_healthy }
      sockethub: { condition: service_healthy }
      api: { condition: service_healthy }
      web: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
  armadietto:
    image: remotestorage/armadietto-monolithic:latest
    platform: linux/amd64
    volumes:
      - armadietto_data:/usr/share/armadietto
      - ./armadietto/conf.json:/etc/armadietto/conf.json:ro
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:8000/storage/",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
  sockethub:
    build:
      context: https://github.com/sockethub/sockethub.git#4ec68c656f0ac5c0fe4321c8bbac6b12a0086664
      target: prod
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:10550/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_PATH: /data/gigger.sqlite
    volumes:
      - api_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  armadietto_data:
  api_data:
