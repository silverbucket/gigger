name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run check
      - run: bun test
      - run: bun run build
      - run: docker compose config --quiet && DOMAIN=example.com APP_ORIGIN=https://example.com docker compose -f compose.prod.yml config --quiet
      - run: make up-test
      - run: make seed && make seed
      - name: Check proxy routes
        run: |
          curl -fsS http://localhost:8080/ | grep -q Showday
          curl -fsS http://localhost:8080/api/items | grep -q 'Welcome to Showday'
          curl -fsS 'http://localhost:8080/.well-known/webfinger?resource=acct:alice@localhost:8080' | grep -q 'http://localhost:8080/storage/storage/alice'
          curl -fsS 'http://localhost:8080/sockethub/?EIO=4&transport=polling' | grep -q 'sid'
          curl -sS -o /dev/null -w '%{http_code}' http://localhost:8080/b/nobody | grep -q 404
      - run: AUTH_TEST_URL=http://localhost:8080/api bun test api/test/auth.integration.test.ts
      - run: MAIL_TEST_URL=http://localhost:8080 MAILPIT_URL=http://localhost:8025 bun test api/test/messages.integration.test.ts
      - run: bunx playwright install --with-deps chromium webkit
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
      - if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml logs && docker compose -f docker-compose.yml -f docker-compose.test.yml down -v
  publish:
    needs: test
    if: github.ref == 'refs/heads/main' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # One publish run per ref at a time, so the shared main/pr-N tags always come from one commit.
    concurrency:
      group: publish-${{ github.ref }}-${{ matrix.image }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [api, web, armadietto]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/silverbucket/gigger/${{ matrix.image }}:${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
            ghcr.io/silverbucket/gigger/${{ matrix.image }}:${{ github.sha }}
